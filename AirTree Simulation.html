<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AirTree Simulation</title>
<style>
:root{--bg:#f4efe6;--fg:#1f3d2b;--mut:#6b4a33;--card:#fff;--ac:#2e7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--fg:#e8efe9;--mut:#c9a98f;--card:#1d2c24;--ac:#6fcf97}}
:root[data-theme="dark"]{--bg:#14201a;--fg:#e8efe9;--mut:#c9a98f;--card:#1d2c24;--ac:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;padding:12px}
h1{font-size:22px;margin:0}small{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
button{font:inherit;padding:8px 16px;border-radius:10px;border:2px solid var(--ac);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--ac);color:#fff}
canvas{width:100%;max-width:1100px;display:block;border-radius:14px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;max-width:1100px;margin:10px auto}
.c{background:var(--card);border-radius:12px;padding:10px}.c b{display:block;font-size:22px}.c span{font-size:12px;color:var(--mut)}
details{max-width:1100px;margin:6px auto;background:var(--card);border-radius:12px;padding:8px 12px}
label{display:inline-block;margin:6px 12px 6px 0;font-size:13px}
</style></head><body>
<div class="bar"><div><h1>AirTree &ndash; Live Simulation</h1><small>Where Energy Meets Nature</small></div>

<div class="c"><b id="sS">--</b><span>Wind / Solar share</span></div>
